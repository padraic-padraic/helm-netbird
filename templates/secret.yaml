{{- if not .Values.global.existingSecret }}
{{- /* Every key referenced by a secretEnv mapping must have a value in global.secrets. */ -}}
{{- $secrets := .Values.global.secrets | default dict }}
{{- range $svc := list "server" "dashboard" }}
{{- range $env, $key := (index $.Values $svc).secretEnv }}
{{- $_ := required (printf "%s.secretEnv maps %s to key %q, but global.secrets.%s is empty (or set global.existingSecret)" $svc $env $key $key) (index $secrets $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbird.secretName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := $secrets }}
  {{- if $val }}
  {{ $key }}: {{ $val | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}

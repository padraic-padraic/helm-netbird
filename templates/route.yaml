{{- if .Values.global.route.enabled -}}
{{- $fullName := include "netbird.fullname" . -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-server
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- with .Values.global.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ default .Values.global.domain.global  | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-server
          port: {{ .Values.global.server.port }}
      matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /oauth2
        - path:
            type: PathPrefix
            value: /ws-proxy
        {{- if not (include "netbird.relay.enabled" .) }}
        - path:
            type: PathPrefix
            value: /relay
        {{- end }}
      timeouts:
        request: 3600s
        backendRequest: 3600s


{{- if include "netbird.relay.inCluster" . }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-relay
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- with .Values.global.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ include "netbird.relay.domain" . | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-relay
          port: {{ .Values.global.relay.port }}
      matches:
        - path:
            type: PathPrefix
            value: /relay
      timeouts:
        request: 3600s
        backendRequest: 3600s
{{- end }}


---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- with .Values.global.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ default .Values.global.domain.global  | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-dashboard
          port: {{ .Values.global.dashboard.port }}
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 3600s
        backendRequest: 3600s



{{- /*
STUN. With the embedded relay the server serves STUN; with relays enabled the server's STUN is off, so the route
targets the in-cluster relay instead, and is dropped entirely when STUN comes from relay.external.stuns.
*/ -}}
{{- $stunBackend := "" -}}
{{- $stunPort := 0 -}}
{{- if include "netbird.relay.inClusterStun" . -}}
{{- $stunBackend = printf "%s-relay" $fullName -}}
{{- $stunPort = .Values.global.relay.stun_port -}}
{{- else if not (include "netbird.relay.enabled" .) -}}
{{- $stunBackend = printf "%s-server" $fullName -}}
{{- $stunPort = .Values.global.server.stun_port -}}
{{- end }}
{{- if $stunBackend }}
---
{{- /* UDPRoute is GA (v1) since Gateway API 1.6; older clusters only serve v1alpha2. Auto-detect unless overridden. */ -}}
{{- $udpApiVersion := .Values.global.route.udpRouteApiVersion | default (ternary "gateway.networking.k8s.io/v1" "gateway.networking.k8s.io/v1alpha2" (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/UDPRoute")) }}
apiVersion: {{ $udpApiVersion }}
kind: UDPRoute
metadata:
  name: {{ $fullName }}-stun
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- with .Values.global.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.stunParentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $stunBackend }}
          port: {{ $stunPort }}
{{- end }}



---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ $fullName }}-server-management
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- with .Values.global.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ default .Values.global.domain.global  | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-server
          port: {{ .Values.global.server.port }}
      matches:
        - method:
            type: Exact
            service: management.ManagementService



---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ $fullName }}-server-signal
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- with .Values.global.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ default .Values.global.domain.global  | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-server
          port: {{ .Values.global.server.port }}
      matches:
        - method:
            type: Exact
            service: signalexchange.SignalExchange



{{ if eq .Values.global.route.vendor "envoy" -}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullName }}-server-management-timeouts
  namespace: {{ .Values.global.namespace }}
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: GRPCRoute
      name: {{ $fullName }}-server-management
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 86400s
  tcpKeepalive:
    idleTime: 30s
    interval: 30s
    probes: 5

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullName }}-server-signal-timeouts
  namespace: {{ .Values.global.namespace }}
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: GRPCRoute
      name: {{ $fullName }}-server-signal
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 86400s
  tcpKeepalive:
    idleTime: 30s
    interval: 30s
    probes: 5
{{- if include "netbird.relay.inCluster" . }}

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullName }}-relay-timeouts
  namespace: {{ .Values.global.namespace }}
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
      name: {{ $fullName }}-relay
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 86400s
  tcpKeepalive:
    idleTime: 30s
    interval: 30s
    probes: 5
{{- end }}
{{- end }}



{{- end }}

{{- $p := .Values.server.persistence }}
{{- if and $p.enabled (not $p.existingClaim) }}
{{- $pvcName := printf "%s-%s" (include "netbird.fullname" .) $p.volumeName -}}

{{- $storageClass := $p.storageClass -}}
{{- if not $storageClass -}}
  {{- $existing := lookup "v1" "PersistentVolumeClaim" .Values.global.namespace $pvcName -}}
  {{- if and $existing $existing.spec $existing.spec.storageClassName -}}
    {{- $storageClass = $existing.spec.storageClassName -}}
  {{- end -}}
{{- end -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
    {{- with $p.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- with $p.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $p.accessModes }}
  accessModes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size | quote }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
  {{- with $p.volumeMode }}
  volumeMode: {{ . | quote }}
  {{- end }}
  {{- with $p.selector }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $p.dataSource }}
  dataSource:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

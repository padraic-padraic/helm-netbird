# Default values for netbird.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


global:
  namespace: 'netbird'
  # Domain name used for access, ex netbird.example.com
  domain:
    global: '' # This is the only required domain.  The below ones are optional for if your network topology requires them.
    vpn: ''  # This is the domain used internally by netbird for vpn clients.
    relay: ''  # Hostname peers use for the in-cluster relay (and its STUN). Defaults to global.
  dashboard:
    port: 80
  server:
    port: 80
    stun_port: 3478  # Only used while the server runs the embedded relay/STUN (relay.enabled=false)
  relay:
    port: 80         # In-cluster relay Service/container port (websocket at /relay)
    stun_port: 3478  # In-cluster relay STUN port (UDP)

  # One pre-existing Secret shared by the server and the dashboard. Each service maps env var names to keys
  # in this Secret via <service>.secretEnv below.
  existingSecret: ''
  # Fallback: when existingSecret is empty, the chart creates a Secret named <release>-secrets from this map.
  # Every key referenced by a secretEnv mapping must be present here. Prefer existingSecret in production.
  secrets:
    authSecret: ''          # openssl rand -base64 32 ; relay shared secret (server.authSecret)
    storeEncryptionKey: ''  # openssl rand -base64 32 ; datastore key (server.store.encryptionKey)

  ingress:
    enabled: false
    className: ''
    annotations: {}
    extra_hosts: []

  route:
    enabled: false
    vendor: ''
    parentRefs: []
    # STUN likely uses a different port in the gateway, so you can specify a different parent ref here
    stunParentRefs: []
    # API version for the STUN UDPRoute. Empty = auto: 'gateway.networking.k8s.io/v1' when the cluster serves it
    # (Gateway API >= 1.6), otherwise 'gateway.networking.k8s.io/v1alpha2'.
    udpRouteApiVersion: ''
    annotations: {}

  serviceAccount:
    create: true
    automount: true
    annotations: { }
    name: ""


dashboard:
  image:
    repository: netbirdio/dashboard
    tag: v2.98.0
    pullPolicy: IfNotPresent
  annotations: {}
  labels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  replicaCount: 1
  resources: {}
  livenessProbe:
  readinessProbe:
  service:
    type: ClusterIP
    annotations: {}
  extra_volumes: []
  extra_volumeMounts: []
  # Default environment for the dashboard, rendered into a ConfigMap. Domain-derived variables
  # (NETBIRD_MGMT_API_ENDPOINT, NETBIRD_MGMT_GRPC_API_ENDPOINT, AUTH_AUTHORITY) are added by the chart
  # and can also be overridden here.
  env:
    AUTH_AUDIENCE: netbird-dashboard
    AUTH_CLIENT_ID: netbird-dashboard
    AUTH_CLIENT_SECRET: ''
    USE_AUTH0: 'false'
    AUTH_SUPPORTED_SCOPES: 'openid profile email'
    AUTH_REDIRECT_URI: /nb-auth
    AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
    NGINX_SSL_PORT: '443'
    LETSENCRYPT_DOMAIN: none
  # Env vars sourced from the shared Secret (global.existingSecret): env var name -> Secret key.
  # These take precedence over the same-named variable in env above.
  # WARNING: with the embedded IdP the dashboard client is public; do NOT map AUTH_CLIENT_SECRET here or login
  # fails with "invalid_client". Only use it for an external IdP with a confidential client.
  secretEnv: {}


server:
  image:
    repository: netbirdio/netbird-server
    tag: 0.83.2
    pullPolicy: IfNotPresent
  annotations: {}
  labels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  replicaCount: 1
  resources: {}
  livenessProbe:
  readinessProbe:
  service:
    type: ClusterIP
    annotations: {}
  extra_volumes: []
  extra_volumeMounts: []
  extra_args: []
  persistence:
    # PVC (only the server uses storage)
    enabled: true            # false -> emptyDir
    existingClaim: ''        # use this PVC instead of creating one
    volumeName: 'data'       # volume name; created PVC is named <release>-<volumeName>
    storageClass:            # empty -> cluster default (an existing claim's class is preserved on upgrade)
    accessModes:
      - ReadWriteOnce
    size: 4Gi
    volumeMode:
    annotations: {}
    labels: {}
    selector: {}
    dataSource: {}
    # Mounts
    dataDir: /var/lib/netbird                  # server.dataDir in config.yaml
    mountPath: /var/lib/netbird                # where the volume is mounted in the container
    subPath: 'server'                          # subPath within the volume (pre-0.66 installs used 'management')
    configMountPath: /etc/netbird/config.yaml  # where the rendered config is written

  # Server config.yaml. This tree is written verbatim to a ConfigMap after the chart adds domain-derived
  # fields (listenAddress, exposedAddress, stunPorts, dataDir, auth.issuer, auth.dashboardRedirectURIs)
  # and placeholders for the secret fields (authSecret, store.encryptionKey). Anything set here wins
  # over the derived values. Lists replace rather than append.
  config:
    server:
      metricsPort: 9090
      healthcheckAddress: ':9000'
      logLevel: info
      logFile: console
      auth:
        signKeyRefreshEnabled: true
        cliRedirectURIs:
          - 'http://localhost:53000/'
      reverseProxy:
        trustedHTTPProxies:
          - '0.0.0.0/0'
      store:
        engine: sqlite

  # Env vars sourced from the shared Secret (global.existingSecret): env var name -> Secret key.
  # Each env var is substituted into a matching ${ENV_VAR} placeholder in config.yaml at startup.
  # Add entries here plus ${ENV_VAR} placeholders under server.config to inject other secrets
  # (e.g. a Postgres DSN). Values must not contain '|', '&' or '\' (sed delimiter/specials).
  secretEnv:
    NB_AUTH_SECRET: authSecret
    NB_STORE_ENCRYPTION_KEY: storeEncryptionKey
  # Init container that renders the final config.yaml. Defaults to the server image (Ubuntu-based, has sh/sed).
  configInit:
    image:
      repository: ''   # defaults to server.image.repository
      tag: ''          # defaults to server.image.tag
      pullPolicy: ''   # defaults to server.image.pullPolicy
    resources: {}


# Relays other than the server's embedded one. Enabling this disables the embedded relay AND the embedded STUN
# server (NetBird runs STUN as part of the relay), so STUN must then come from the in-cluster relay or from
# relay.external.stuns. Peers are told about every address listed here; all relays must share
# global.secrets.authSecret (server.relays.secret).
relay:
  enabled: false
  # Relay Deployment in this cluster, exposed on https://<global.domain.relay>/relay through the Gateway.
  # Advertised to peers as rels://<global.domain.relay>:443, the same address the embedded relay used.
  inCluster:
    enabled: false
    exposedAddress: ''  # override the advertised address, e.g. rels://relay.example.com:443
    stun:
      enabled: true     # serve STUN from the relay pod; the UDPRoute then targets the relay instead of the server
    image:
      repository: netbirdio/relay
      tag: ''           # defaults to Chart.appVersion
      pullPolicy: IfNotPresent
    annotations: {}
    labels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    replicaCount: 1
    resources: {}
    livenessProbe:
    readinessProbe:
    service:
      type: ClusterIP
      annotations: {}
    extra_volumes: []
    extra_volumeMounts: []
    extra_args: []
    logLevel: info
    # Upstream proxies whose X-Real-Ip header is trusted (comma-joined into NB_TRUSTED_PROXIES)
    trustedProxies:
      - '0.0.0.0/0'
    # Extra/override env for the relay container (NB_* flags). Chart-derived values are set first; these win.
    env: {}
    # Env vars sourced from the shared Secret (global.existingSecret): env var name -> Secret key.
    secretEnv:
      NB_AUTH_SECRET: authSecret
  # Relays outside this chart. Listed after the in-cluster relay when both are configured.
  external:
    addresses: []       # e.g. ['rels://relay1.example.com:443']
    # STUN servers for peers (server.stuns). Required when there is no in-cluster relay serving STUN.
    # Prepended with the in-cluster relay's STUN when relay.inCluster.stun.enabled.
    stuns: []           # e.g. [{uri: 'stun:relay1.example.com:3478'}]
  credentialsTTL: 12h   # server.relays.credentialsTTL

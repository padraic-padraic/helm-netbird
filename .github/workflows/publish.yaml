name: Publish Helm chart to GHCR

env:
  CHART_NAME: netbird
  GHCR_REGISTRY: ghcr.io
  # Publishes to ghcr.io/<owner>/helm-netbird/netbird, e.g. ghcr.io/padraic-padraic/helm-netbird/netbird
  GHCR_NAMESPACE: ${{ github.repository_owner }}/helm-netbird

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Compute chart version from tag
        run: |
          set -e
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "ERROR: tag ${GITHUB_REF} is not of the form vX.Y.Z"
            exit 1
          fi
          echo "Using chart version: ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint ./ --set global.domain.global=netbird.example.com --set global.existingSecret=netbird-secrets

      - name: Package chart
        run: |
          mkdir -p packages
          helm package ./ --version "${VERSION}" --destination packages
          helm package ./ --version "0.0.0-latest" --destination packages

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "${GHCR_REGISTRY}" \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push chart to GHCR (OCI)
        run: |
          for tgz in "packages/${CHART_NAME}-${VERSION}.tgz" "packages/${CHART_NAME}-0.0.0-latest.tgz"; do
            if [ ! -f "${tgz}" ]; then
              echo "Chart package ${tgz} not found"
              exit 1
            fi
            helm push "${tgz}" "oci://${GHCR_REGISTRY}/${GHCR_NAMESPACE}"
          done

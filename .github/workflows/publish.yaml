name: Publish Helm chart to GHCR

env:
  CHART_NAME: netbird
  GHCR_REGISTRY: ghcr.io
  # Publishes to ghcr.io/<owner>/helm-netbird/netbird, e.g. ghcr.io/padraic-padraic/helm-netbird/netbird
  GHCR_NAMESPACE: ${{ github.repository_owner }}/helm-netbird

on:
  push:
    tags:
      - 'v*'

# One release at a time per tag; never cancel an in-flight publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Package and push chart to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write  # helm push to ghcr.io via GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Compute chart version from tag
        run: |
          set -e
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "ERROR: tag ${GITHUB_REF} is not of the form vX.Y.Z"
            exit 1
          fi
          echo "Using chart version: ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint ./ --set global.domain.global=netbird.example.com --set global.existingSecret=netbird-secrets

      - name: Package chart
        run: |
          mkdir -p packages
          helm package ./ --version "${VERSION}" --destination packages
          helm package ./ --version "0.0.0-latest" --destination packages

      - name: Login to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | \
            helm registry login "${GHCR_REGISTRY}" \
              --username "${GHCR_USER}" \
              --password-stdin

      - name: Push chart to GHCR (OCI)
        run: |
          for tgz in "packages/${CHART_NAME}-${VERSION}.tgz" "packages/${CHART_NAME}-0.0.0-latest.tgz"; do
            if [ ! -f "${tgz}" ]; then
              echo "Chart package ${tgz} not found"
              exit 1
            fi
            helm push "${tgz}" "oci://${GHCR_REGISTRY}/${GHCR_NAMESPACE}"
          done
